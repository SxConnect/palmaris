# portainer-stack.yml
# Stack pronta para Portainer com suporte a HTTP direto (sem depender de HTTPS)
# e suporte a HTTPS caso esteja disponível ou via Cloudflare.

version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-palmaris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1We5LDFlzqpVmnx}
      POSTGRES_DB: ${POSTGRES_DB:-palmaris}
    volumes:
      - palmaris-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-palmaris} -d ${POSTGRES_DB:-palmaris}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    image: ghcr.io/sxconnect/palmaris:latest
    container_name: palmaris
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-palmaris}:${POSTGRES_PASSWORD:-1We5LDFlzqpVmnx}@db:5432/${POSTGRES_DB:-palmaris}?schema=public
      - APP_URL=${APP_URL:-http://palmaris.com.br}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-contato@palmaris.com.br}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Palmaris@2026}
      - ADMIN_NAME=${ADMIN_NAME:-Palmaris Representações}
      - ADMIN_RESET=${ADMIN_RESET:-true}
      - MAIL_DEFAULT_PASSWORD=${MAIL_DEFAULT_PASSWORD:-Palmaris@2026}
      - CRON_SECRET=${CRON_SECRET:-palmaris-cron-secret-2026}
      - STALWART_JMAP_URL=${STALWART_JMAP_URL:-http://stalwart-mail:8080/jmap/}
      - STALWART_WELL_KNOWN_URL=${STALWART_WELL_KNOWN_URL:-http://stalwart-mail:8080/.well-known/jmap}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-palmaris}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-portainer_default}"
      # Rota HTTP (porta 80) — responde direto para qualquer navegador sem forçar HTTPS
      - "traefik.http.routers.palmaris-http.rule=Host(`palmaris.com.br`)"
      - "traefik.http.routers.palmaris-http.entrypoints=web"
      - "traefik.http.routers.palmaris-http.service=palmaris"
      # Rota HTTPS (porta 443) — com emissão de certificado Let's Encrypt
      - "traefik.http.routers.palmaris-https.rule=Host(`palmaris.com.br`)"
      - "traefik.http.routers.palmaris-https.entrypoints=websecure"
      - "traefik.http.routers.palmaris-https.service=palmaris"
      - "traefik.http.routers.palmaris-https.tls=true"
      - "traefik.http.routers.palmaris-https.tls.certresolver=leresolver"
      # Serviço conectando na porta 3000 do container
      - "traefik.http.services.palmaris.loadbalancer.server.port=3000"

volumes:
  palmaris-db:
    driver: local

networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-portainer_default}
