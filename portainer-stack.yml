# portainer-stack.yml
# Stack pronta para colar no Portainer (Stacks → Add stack), integrada ao Traefik
# e com suporte a HTTPS automático (Let's Encrypt).
#
# A imagem do container é auto-migrante:
# 1. Aguarda o PostgreSQL ficar pronto (healthcheck).
# 2. Executa as migrações (prisma migrate deploy).
# 3. Executa o seed idempotente com todo o layout e dados da Palmaris.
# 4. Inicia o servidor Next.js em produção.

version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-palmaris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque-esta-senha}
      POSTGRES_DB: ${POSTGRES_DB:-palmaris}
    volumes:
      - palmaris-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-palmaris} -d ${POSTGRES_DB:-palmaris}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    image: ghcr.io/sxconnect/palmaris:latest
    container_name: palmaris
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-palmaris}:${POSTGRES_PASSWORD:-troque-esta-senha}@db:5432/${POSTGRES_DB:-palmaris}?schema=public
      - APP_URL=${APP_URL:-https://palmaris.com.br}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-contato@palmaris.com.br}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Palmaris@2026}
      - ADMIN_NAME=${ADMIN_NAME:-Palmaris Representações}
      - ADMIN_RESET=${ADMIN_RESET:-false}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-palmaris}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-portainer_default}"
      # Router HTTPS (websecure)
      - "traefik.http.routers.palmaris.rule=Host(`palmaris.com.br`)"
      - "traefik.http.routers.palmaris.entrypoints=websecure"
      - "traefik.http.routers.palmaris.tls=true"
      - "traefik.http.routers.palmaris.tls.certresolver=leresolver"
      - "traefik.http.services.palmaris.loadbalancer.server.port=3000"
      # Router HTTP (porta 80) redirecionando automaticamente para HTTPS
      - "traefik.http.routers.palmaris-http.rule=Host(`palmaris.com.br`)"
      - "traefik.http.routers.palmaris-http.entrypoints=web"
      - "traefik.http.routers.palmaris-http.middlewares=palmaris-redirect"
      - "traefik.http.middlewares.palmaris-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.palmaris-redirect.redirectscheme.permanent=true"

volumes:
  palmaris-db:
    driver: local

networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-portainer_default}
